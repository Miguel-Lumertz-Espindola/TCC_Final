# Configuração da Porta do Servidor da API
server.port=8080

# Conexão com o PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Database_TCC}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do Hibernate/JPA para criar as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# O relógio do check-in usa este fuso, independentemente do fuso da JVM ou do celular.
gamificacao.checkin.fuso-horario=America/Sao_Paulo
gamificacao.checkin.cafe.inicio=07:00
gamificacao.checkin.cafe.fim-exato=08:00
gamificacao.checkin.cafe.fim-parcial=08:30
gamificacao.checkin.almoco.inicio=12:00
gamificacao.checkin.almoco.fim-exato=13:00
gamificacao.checkin.almoco.fim-parcial=13:30
gamificacao.checkin.jantar.inicio=19:00
gamificacao.checkin.jantar.fim-exato=20:00
gamificacao.checkin.jantar.fim-parcial=20:30


# Primeiro desbloqueio para demonstração; pontos acumulados, sem custo para trocar.
gamificacao.personagens.pontos-mago=30
